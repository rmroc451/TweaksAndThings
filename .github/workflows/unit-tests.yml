name: Unit Tests

on:
  push:
  pull_request:

jobs:
  settings-and-hotkeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Tests/TweaksAndThings.Tests.csproj --configuration Release
